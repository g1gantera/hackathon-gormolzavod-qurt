<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="146mm" height="206mm" viewBox="0 0 146 206"><rect x="0" y="0" width="146" height="206" rx="0" fill="#FCF8F3" stroke="none"/><rect x="0" y="140" width="146" height="66" rx="0" fill="#A4CFFF" stroke="none"/><text x="13" y="19" font-family="Open Sans" font-size="7" fill="#1D3484" font-weight="700">Құрт ысталған</text><text x="13" y="27" font-family="Open Sans" font-size="5" fill="#1D3484" font-weight="600">Курт копчёный</text><text x="13" y="37" font-family="Open Sans" font-size="2.7" fill="#1D3484" font-weight="400">Майсыз тұздалған құрт / Курт нежирный солёный</text><text x="13" y="41" font-family="Open Sans" font-size="2.7" fill="#1D3484" font-weight="400">Таза салмағы / Масса нетто: 120 г</text><text x="13" y="50.0" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">Құрамы: майсыз сүзбе, ас тұзы.</text><text x="13" y="54.2" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">Состав: творог нежирный, соль поваренная пищевая.</text><text x="13" y="58.4" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">100 г өнімнің тағамдық құндылығы:</text><text x="13" y="62.6" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">ақуыздар — 60 г; көмірсулар — 17 г.</text><text x="13" y="66.8" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">Пищевая ценность на 100 г: белки — 60 г; углеводы — 17 г.</text><text x="13" y="71.0" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">Энергетикалық құндылығы / Энергетическая ценность:</text><text x="13" y="75.2" font-family="Open Sans" font-size="2.65" fill="#1D3484" font-weight="400">200 ккал / 837 кДж.</text><text x="13" y="84.0" font-family="Open Sans" font-size="2.55" fill="#1D3484" font-weight="400">+15 °C-тан аспайтын температурада және ауаның</text><text x="13" y="88.1" font-family="Open Sans" font-size="2.55" fill="#1D3484" font-weight="400">салыстырмалы ылғалдылығы 75%-дан аспайтын жерде сақтау.</text><text x="13" y="92.2" font-family="Open Sans" font-size="2.55" fill="#1D3484" font-weight="400">Жарамдылық мерзімі: 3 ай.</text><text x="13" y="96.3" font-family="Open Sans" font-size="2.55" fill="#1D3484" font-weight="400">Хранить при температуре не выше +15 °C и относительной</text><text x="13" y="100.4" font-family="Open Sans" font-size="2.55" fill="#1D3484" font-weight="400">влажности воздуха не более 75%. Срок годности: 3 месяца.</text><text x="13" y="110.0" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">Өндіруші / Изготовитель: ТОО «Гормолзавод».</text><text x="13" y="113.9" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">020000, Қазақстан Республикасы, Ақмола облысы,</text><text x="13" y="117.8" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">Көкшетау қ., Шығыс өнеркәсіптік аймағы, 20-өткел, 8в.</text><text x="13" y="121.7" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">020000, Республика Казахстан, Акмолинская область,</text><text x="13" y="125.6" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">г. Кокшетау, Восточная промышленная зона, 20-й проезд, 8в.</text><text x="13" y="129.5" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">+7 747 377 15 29 · +7 7162 77 15 29 · +7 7162 92 66 00</text><text x="13" y="133.4" font-family="Open Sans" font-size="2.45" fill="#1D3484" font-weight="400">ok@gormolzavod.kz · Instagram: @gormolzavod</text><rect x="12" y="141" width="122" height="17" rx="2" fill="#FFFDFC" stroke="none"/><text x="15" y="147" font-family="Open Sans" font-size="2.5" fill="#1D3484" font-weight="400">Өндірілген күні / Дата выработки: __________</text><text x="15" y="153" font-family="Open Sans" font-size="2.5" fill="#1D3484" font-weight="400">Партия нөмірі / Номер партии: __________</text><text x="13" y="164" font-family="Open Sans" font-size="2.6" fill="#1D3484" font-weight="400">Кодты тіркеңіз және сыйлыққа жинаңыз.</text><text x="13" y="168" font-family="Open Sans" font-size="2.6" fill="#1D3484" font-weight="400">Регистрируйте коды и копите на награду.</text><text x="13" y="172" font-family="Open Sans" font-size="2.6" fill="#1D3484" font-weight="400">Мерзімі / Сроки: [келісу / согласовать]</text><text x="13" y="176" font-family="Open Sans" font-size="2.6" fill="#1D3484" font-weight="400">Толық ережелер / Полные правила: [URL]</text><rect x="13" y="181" width="45" height="15" rx="1" fill="#FFFDFC" stroke="none"/><text x="17" y="190" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">EAN-13: [номер]</text><text x="64" y="188" font-family="Open Sans" font-size="6" fill="#1D3484" font-weight="600">EAC   KZ</text><text x="64" y="194" font-family="Open Sans" font-size="2.5" fill="#1D3484" font-weight="400">[Материал / утилизация]</text></svg>