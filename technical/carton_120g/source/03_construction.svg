<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297"><rect x="0" y="0" width="420" height="297" rx="0" fill="#FCF8F3" stroke="none"/><text x="12" y="15" font-family="Open Sans" font-size="6" fill="#1D3484" font-weight="700">КАРТОННАЯ КОРОБКА / СХЕМА РАЗВЁРТКИ</text><text x="12" y="24" font-family="Open Sans" font-size="3.5" fill="#1D3484" font-weight="400">120 г • 140 × 200 × 45 мм • предварительно, проверить наполнением</text><rect x="40.0" y="68" width="11.25" height="150.0" rx="0" fill="#FFFDFC" stroke="#0861C6"/><rect x="51.25" y="68" width="105.0" height="150.0" rx="0" fill="#FFFDFC" stroke="#0861C6"/><text x="55.0" y="82" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">ЛИЦЕВАЯ</text><rect x="51.25" y="34.25" width="105.0" height="33.75" rx="0" fill="#A4CFFF" stroke="#0861C6"/><rect x="51.25" y="218.0" width="105.0" height="33.75" rx="0" fill="#A4CFFF" stroke="#0861C6"/><path d="M51.25 68 v150" stroke="#F84764" stroke-dasharray="2 2" fill="none"/><rect x="156.25" y="68" width="33.75" height="150.0" rx="0" fill="#FFFDFC" stroke="#0861C6"/><text x="160.0" y="82" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">БОК</text><rect x="156.25" y="51.5" width="33.75" height="16.5" rx="0" fill="#A4CFFF" stroke="#0861C6"/><rect x="156.25" y="218.0" width="33.75" height="16.5" rx="0" fill="#A4CFFF" stroke="#0861C6"/><path d="M156.25 68 v150" stroke="#F84764" stroke-dasharray="2 2" fill="none"/><rect x="190.0" y="68" width="105.0" height="150.0" rx="0" fill="#FFFDFC" stroke="#0861C6"/><text x="193.75" y="82" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">ОБОРОТНАЯ</text><rect x="190.0" y="34.25" width="105.0" height="33.75" rx="0" fill="#A4CFFF" stroke="#0861C6"/><rect x="190.0" y="218.0" width="105.0" height="33.75" rx="0" fill="#A4CFFF" stroke="#0861C6"/><path d="M190.0 68 v150" stroke="#F84764" stroke-dasharray="2 2" fill="none"/><rect x="295.0" y="68" width="33.75" height="150.0" rx="0" fill="#FFFDFC" stroke="#0861C6"/><text x="298.75" y="82" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">БОК</text><rect x="295.0" y="51.5" width="33.75" height="16.5" rx="0" fill="#A4CFFF" stroke="#0861C6"/><rect x="295.0" y="218.0" width="33.75" height="16.5" rx="0" fill="#A4CFFF" stroke="#0861C6"/><path d="M295.0 68 v150" stroke="#F84764" stroke-dasharray="2 2" fill="none"/><text x="58" y="103" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Логотип</text><text x="58" y="120" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Наименование</text><text x="58" y="137" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Изображение курта</text><text x="58" y="154" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">120 г + QR</text><text x="207" y="103" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Состав и ценность</text><text x="207" y="120" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Условия хранения</text><text x="207" y="137" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Изготовитель</text><text x="207" y="154" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Поля даты / партии</text><text x="207" y="171" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="400">Правила акции</text><text x="195" y="47" font-family="Open Sans" font-size="3" fill="#1D3484" font-weight="400">Код на внутренней стороне клапана</text><text x="205" y="54" font-family="Open Sans" font-size="4" fill="#1D3484" font-weight="700">DEMO-7K2P-9M4Q</text><text x="12" y="265" font-family="Open Sans" font-size="3.2" fill="#1D3484" font-weight="400">Синий — условный рез; розовый пунктир — сгиб. Клапаны и замки уточняет производитель.</text><text x="12" y="271" font-family="Open Sans" font-size="3.2" fill="#1D3484" font-weight="400">Бумажная пломба закрывает верх; код виден после вскрытия. Вкладыш изолирует продукт от картона и печати.</text><text x="12" y="277" font-family="Open Sans" font-size="3.2" fill="#1D3484" font-weight="400">Нет пластиковой ламинации и окна. Герметичность, барьер и отсутствие полимеров во вкладыше пока не подтверждены.</text><text x="12" y="283" font-family="Open Sans" font-size="3.2" fill="#1D3484" font-weight="400">Это схема конструкции: компенсации толщины картона, клеевые припуски и вылеты под штамп не рассчитаны.</text></svg>