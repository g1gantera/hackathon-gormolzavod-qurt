<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><rect x="0" y="0" width="297" height="210" fill="#FCF8F3" stroke="none" /><text x="15" y="17" font-family="Open Sans" font-size="7" font-weight="700" fill="#1D3484" text-anchor="start">ФОРМАТ БАТОНЧИКА · 60 г</text><text x="15" y="25" font-family="Open Sans" font-size="3.2" font-weight="400" fill="#1D3484" text-anchor="start">Схема образца. Размеры плоского пакета, не габариты наполненного изделия.</text><g transform="translate(18 38)"><rect x="0" y="0" width="240" height="100" fill="#FFFDFC" stroke="#1D3484" /><rect x="0" y="0" width="12" height="100" fill="#A4CFFF" stroke="none" /><rect x="0" y="0" width="220" height="7" fill="#A4CFFF" stroke="none" /><rect x="0" y="93" width="220" height="7" fill="#A4CFFF" stroke="none" /><rect x="210" y="0" width="10" height="100" fill="#fcbac8" stroke="none" /><rect x="220" y="0" width="20" height="100" fill="#e5edf8" stroke="none" /><rect x="19" y="59" width="145" height="28" fill="none" stroke="#0861C6" stroke-dasharray="2 1"/><rect x="223" y="16" width="14" height="67" fill="none" stroke="#0861C6" /><text x="20" y="17" font-family="Open Sans" font-size="4" font-weight="700" fill="#1D3484" text-anchor="start">Пищевая полость</text><text x="20" y="24" font-family="Open Sans" font-size="3" font-weight="400" fill="#1D3484" text-anchor="start">Пять кусочков в один ряд; фасовка по массе.</text><path d="M204 7V93" fill="none" stroke="#0861C6" stroke-width="0.4" stroke-dasharray="2 2"/><text x="20" y="48" font-family="Open Sans" font-size="3" font-weight="400" fill="#1D3484" text-anchor="start">Прозрачное окно без высечки</text><path d="M-3 0H-6V100H-3" fill="none" stroke="#0861C6" stroke-width="0.4" /><g transform="translate(-9 62) rotate(-90)"><text x="0" y="0" font-family="Open Sans" font-size="3" font-weight="400" fill="#1D3484" text-anchor="start">100 мм</text></g><path d="M0 104V108H240V104" fill="none" stroke="#0861C6" stroke-width="0.4" /><text x="120" y="114" font-family="Open Sans" font-size="3" font-weight="400" fill="#1D3484" text-anchor="middle">240 мм</text></g><text x="18" y="163" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Синие зоны: заводские швы 12 / 7 / 7 мм.</text><text x="18" y="170" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Розовая зона: финальная запайка x = 210–220 мм.</text><text x="18" y="177" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Правый хвост: внешний скрытый код под защитой.</text><text x="18" y="184" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Надрез x = 204 мм только в кромке; без сквозной</text><text x="18" y="190" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">перфорации пищевой полости до вскрытия.</text><text x="157" y="163" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Пакет из двух полотен; верх и низ сварены.</text><text x="157" y="170" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Камерное вакуумирование после наполнения.</text><text x="157" y="177" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Обычный flow-pack не считается вакуумированием.</text><text x="157" y="184" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Размеры, швы, окно и код требуют образцов.</text><text x="157" y="190" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Вылеты 3 мм условные: согласовать с типографией.</text></svg>