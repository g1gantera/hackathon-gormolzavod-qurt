0.25" /><text x="19" y="12" font-family="Open Sans" font-size="2.6" font-weight="700" fill="#1D3484" text-anchor="start">Құрт ысталған</text><text x="19" y="16.5" font-family="Open Sans" font-size="2.6" font-weight="700" fill="#1D3484" text-anchor="start">Курт копчёный</text><text x="19" y="21.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Құрт майсыз тұздалған / Курт нежирный</text><text x="19" y="24.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">солёный</text><text x="19" y="29.0" font-family="Open Sans" font-size="2.6" font-weight="700" fill="#1D3484" text-anchor="start">Таза салмағы / Масса нетто 60 г</text><text x="19" y="33.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Құрамы: майсыз ірімшік, ас тұзы.</text><text x="19" y="38.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Состав: Творог нежирный, соль поваренная</text><text x="19" y="41.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">пищевая</text><text x="19" y="46.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">100 г өнімнің тағамдық құндылығы: ақуыз – 60</text><text x="19" y="49.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">г; көмірсу – 17 г.</text><text x="19" y="54.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Пищевая ценность на 100 г: Белки – 60 г;</text><text x="19" y="57.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">углеводы – 17 г</text><text x="19" y="62.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Энергетикалық құндылығы / Энергетическая</text><text x="19" y="65.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">ценность: 200 ккал / 837 кДж</text><text x="19" y="74" font-family="Open Sans" font-size="2.3" font-weight="700" fill="#1D3484" text-anchor="start">Акцияға қатысу / Участие в акции</text><text x="19" y="78" font-family="Open Sans" font-size="2.3" font-weight="400" fill="#1D3484" text-anchor="start">Кодты тіркеңіз және сыйлықтарға жинаңыз.</text><text x="19" y="81.6" font-family="Open Sans" font-size="2.3" font-weight="400" fill="#1D3484" text-anchor="start">Регистрируйте коды и копите на подарки.</text><text x="85" y="12" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Құрт 15°C жоғары емес температурада және</text><text x="85" y="15.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">ауаның салыстырмалы ылғалдылығы 75%-ден</text><text x="85" y="19.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">жоғары болмауы тиіс.</text><text x="85" y="24.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Хранить при температуре не выше +15 °C и</text><text x="85" y="27.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">относительной влажности воздуха не более 75 %</text><text x="85" y="32.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Сақтау мерзімі – 3 ай. / Срок годности – 3 месяца</text><text x="85" y="37.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Өндіруші: «Гормолзавод» ЖШС, 020000, Қазақстан</text><text x="85" y="41.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Республикасы, Ақмола облысы, Көкшетау қаласы,</text><text x="85" y="44.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Шығыс өндірістік аймағы 20 өтпе жолы, ғимарат</text><text x="85" y="48.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">8В.</text><text x="85" y="53.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Изготовитель: ТОО «Гормолзавод», 020000,</text><text x="85" y="56.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Республика Казахстан, Акмолинская область, г.</text><text x="85" y="60.0" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Кокшетау, Восточная промышленная зона, 20-й</text><text x="85" y="63.5" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">проезд, 8в</text><text x="157" y="12" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">Байланыс / Контакты</text><text x="157" y="15.25" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">+7 747 377 15 29</text><text x="157" y="18.5" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">+7 7162 77 15 29</text><text x="157" y="21.75" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">+7 7162 92 66 00</text><text x="157" y="25.0" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">ok@gormolzavod.kz</text><text x="157" y="28.25" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="start">Instagram: @gormolzavod</text><text x="157" y="32.5" font-family="Open Sans" font-size="2.0" font-weight="400" fill="#1D3484" text-anchor="start">Өндірілген күні / Дата выработки:</text><text x="157" y="35.300000000000004" font-family="Open Sans" font-size="2.0" font-weight="400" fill="#1D3484" text-anchor="start">____________________________</text><text x="157" y="38.10000000000001" font-family="Open Sans" font-