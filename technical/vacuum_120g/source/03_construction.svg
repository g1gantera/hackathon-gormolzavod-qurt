<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="297mm" height="210mm" viewBox="0 0 297 210"><rect x="0" y="0" width="297" height="210" rx="0" fill="#FCF8F3" stroke="none" /><text x="15" y="16" font-family="Open Sans" font-size="7" font-weight="700" fill="#1D3484" text-anchor="start">ВАКУУМНЫЙ ПАКЕТ 120 г</text><text x="15" y="24" font-family="Open Sans" font-size="3.4" font-weight="400" fill="#1D3484" text-anchor="start">Схема предложения для согласования с изготовителем. Не рабочая оснастка.</text><g transform="translate(26 43) scale(.58)"><rect x="0" y="0" width="160" height="240" rx="0" fill="white" stroke="#1D3484" /><rect x="0" y="0" width="7" height="240" rx="0" fill="#A4CFFF" stroke="none" /><rect x="153" y="0" width="7" height="240" rx="0" fill="#A4CFFF" stroke="none" /><rect x="0" y="230" width="160" height="10" rx="0" fill="#A4CFFF" stroke="none" /><rect x="7" y="0" width="146" height="29" rx="0" fill="#e9edf4" stroke="none" /><rect x="7" y="32" width="146" height="10" rx="0" fill="#ffd1d9" stroke="none" /><rect x="32" y="9" width="96" height="17" rx="0" fill="white" stroke="#0861C6" /><text x="80" y="20" font-family="Open Sans" font-size="4" font-weight="700" fill="#1D3484" text-anchor="middle">СКРЫТЫЙ КОД</text><path d="M7 46 L153 46" fill="none" stroke="#0861C6" stroke-width="0.6" stroke-dasharray="2 2"/><rect x="15" y="53" width="130" height="169" rx="0" fill="none" stroke="#0861C6" stroke-dasharray="2 2"/><text x="80" y="114" font-family="Open Sans" font-size="5" font-weight="700" fill="#1D3484" text-anchor="middle">Пищевая полость</text><text x="80" y="124" font-family="Open Sans" font-size="4" font-weight="400" fill="#1D3484" text-anchor="middle">ПЭ-слой внутрь</text></g><text x="135" y="46" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">160 × 240 мм</text><text x="135" y="51" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Стартовый габарит образца, не утверждённый размер.</text><text x="135" y="60" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Боковые швы: 7 мм</text><text x="135" y="65" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Дно: 10 мм. Ширины проверяет производитель.</text><text x="135" y="74" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Финальная запайка: y = 32–42 мм</text><text x="135" y="79" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">После наполнения. Режим подбирают на оборудовании.</text><text x="135" y="88" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Открывание: y = 46 мм</text><text x="135" y="93" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Надрез ниже герметичного шва; не делать перфорацию</text><text x="135" y="102" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">через пищевую полость до продажи.</text><text x="135" y="111" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Промо-купон: y = 9–26 мм</text><text x="135" y="116" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Наружная зона выше шва. Непрозрачная разрушаемая</text><text x="135" y="125" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">покрышка над переменным кодом. Отдельная операция.</text><text x="135" y="134" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Печать: y = 53–222 мм</text><text x="135" y="139" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Важный текст вне швов и выраженных складок.</text><text x="135" y="148" font-family="Open Sans" font-size="3.6" font-weight="700" fill="#1D3484" text-anchor="start">Вылеты: 3 мм</text><text x="135" y="153" font-family="Open Sans" font-size="2.8" font-weight="400" fill="#1D3484" text-anchor="start">Условные для макета; повтор и метки задаёт типография.</text><text x="15" y="199" font-family="Open Sans" font-size="3" font-weight="400" fill="#1D3484" text-anchor="start">Материал, размеры, швы, кодирование и барьерность требуют образцов и письменного согласования.</text></svg>