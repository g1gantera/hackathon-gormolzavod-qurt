" stroke-dasharray=""/><path d="M156 48 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 60 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 72 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 84 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 96 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 108 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 120 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 132 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 144 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 156 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 168 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 180 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 192 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><path d="M156 204 l2 4 -2 4 -2 -4 Z" fill="none" stroke="#0861C6" stroke-width=".45"/><rect x="35" y="12" width="96" height="17" rx="2" fill="white" stroke="#0861C6" /><text x="83" y="18" font-family="Open Sans" font-size="2.7" font-weight="700" fill="#1D3484" text-anchor="middle">КОД ОСЫ ЖЕРДЕ / КОД ЗДЕСЬ</text><text x="83" y="24" font-family="Open Sans" font-size="2.2" font-weight="400" fill="#1D3484" text-anchor="middle">Жыртып ашыңыз / Откройте отрывной элемент</text><text x="18" y="54" font-family="Open Sans" font-size="4.6" font-weight="700" fill="#1D3484" text-anchor="start">Құрт ысталған</text><text x="18" y="61" font-family="Open Sans" font-size="4.2" font-weight="700" fill="#1D3484" text-anchor="start">Курт копчёный</text><text x="18" y="68" font-family="Open Sans" font-size="2.65" font-weight="400" fill="#1D3484" text-anchor="start">Құрт майсыз тұздалған / Курт нежирный солёный</text><text x="18" y="74" font-family="Open Sans" font-size="3" font-weight="700" fill="#1D3484" text-anchor="start">Таза салмағы / Масса нетто 120 г</text><text x="18" y="83" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Құрамы: майсыз ірімшік, ас тұзы.</text><text x="18" y="87.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Состав: Творог нежирный, соль поваренная пищевая</text><text x="18" y="94" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">100 г өнімнің тағамдық құндылығы:</text><text x="18" y="98.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">ақуыз – 60 г; көмірсу – 17 г.</text><text x="18" y="102.4" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Пищевая ценность на 100 г: Белки – 60 г; углеводы – 17 г</text><text x="18" y="109" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Энергетикалық құндылығы / Энергетическая ценность:</text><text x="18" y="113.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">200 ккал / 837 кДж</text><text x="18" y="120" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Құрт 15°C жоғары емес температурада және</text><text x="18" y="124.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">ауаның салыстырмалы ылғалдылығы 75%-ден жоғары</text><text x="18" y="128.4" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">болмауы тиіс. Сақтау мерзімі – 3 ай.</text><text x="18" y="135" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Хранить при температуре не выше +15 °C и относительной</text><text x="18" y="139.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">влажности воздуха не более 75 %. Срок годности – 3 месяца</text><text x="18" y="146" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Өндіруші: «Гормолзавод» ЖШС, Қазақстан Республикасы,</text><text x="18" y="150.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">020000, Ақмола облысы, Көкшетау қаласы,</text><text x="18" y="154.4" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Шығыс өндірістік аймағы 20 өтпе жолы, ғимарат 8В.</text><text x="18" y="161" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Изготовитель: ТОО «Гормолзавод», 020000, Республика</text><text x="18" y="165.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Казахстан, Акмолинская область, г. Кокшетау,</text><text x="18" y="169.4" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">Восточная промышленная зона, 20-й проезд, 8в</text><text x="18" y="176" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">+7 747 377 15 29, +7 7162 77 15 29, +7 7162 92 66 00</text><text x="18" y="180.2" font-family="Open Sans" font-size="2.6" font-weight="400" fill="#1D3484" text-anchor="start">ok@gormolzavod.kz  ·  Instagram: @gormolzavod</text><text x="18" y="187" font-family="Open Sans" font-size="2.55" font-weight="400" fill="#1D3484" text-anchor="start">Өндірілген күні / Дата выработки: __________</text><text x="18" y="193" font-family="Open Sans" font-size="2.55" font-weight="400" fill="#1D3484" text-anchor="start">Партия нөмірі / Номер партии: __________</text><rect x="18" y="197" width="40" height="26" rx="0" fill="white" stroke="#A4CFFF" /><text x="38" y="207" font-family="Open Sans" font-size="3" font-weight="700" fill="#1D3484" text-anchor="middle">EAN-13</text><text x="38" y="213" font-family="Open Sans" font-size="2.4" font-weight="400" fill="#1D3484" text-anchor="middle">40 × 26 мм</text><text x="38" y="218" font-family="Open Sans" font-size="2.1" font-weight="400" fill="#1D3484" text-anchor="middle">номер не предоставлен</text><text x="65" y="202" font-family="Open Sans" font-size="2.5" font-weight="700" fill="#1D3484" text-anchor="start">ЕАС / KZ / утилизация</text><text x="65" y="207" font-family="Open Sans" font-size="2.1" font-weight="400" fill="#1D3484" text-anchor="start">места знаков; файлы согласовать</text><text x="65" y="214" font-family="Open Sans" font-size="2.1" font-weight="400" fill="#1D3484" text-anchor="start">Акция мерзімі / Сроки акции: [даты]</text><text x="65" y="218" font-family="Open Sans" font-size="2.1" font-weight="400" fill="#1D3484" text-anchor="start">Ережелер / Правила: [публичный URL]</text><text x="65" y="222" font-family="Open Sans" font-size="2.1" font-weight="400" fill="#1D3484" text-anchor="start">Условия участия: согласовать до печати</text></svg>